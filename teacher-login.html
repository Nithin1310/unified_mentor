
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Appointment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card animate-fade-in">
            <div class="auth-header">
                <h1 class="auth-title">Teacher Login</h1>
                <p class="auth-subtitle">Welcome back! Please sign in to your account.</p>
            </div>
            
            <form id="teacherLoginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required 
                           placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required 
                           placeholder="Enter your password">
                </div>
                
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="teacher-register.html" class="auth-link">Register here</a></p>
                <p><a href="index.html" class="auth-link">← Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
