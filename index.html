
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZone Gym Management System</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section with Navigation Options -->
    <div class="hero-container">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="logo-section">
                <h1 class="logo-title">FitWithNithin</h1>
                <p class="logo-subtitle">Gym Management System</p>
            </div>
            
            <div class="portal-cards">
                <div class="portal-card admin-card" onclick="window.location.href='login-admin.html'">
                    <div class="card-icon">👑</div>
                    <h3>Admin Portal</h3>
                    <p>Manage gym operations, members, and staff</p>
                    <div class="card-arrow">→</div>
                </div>
                
                <div class="portal-card member-card" onclick="window.location.href='login-member.html'">
                    <div class="card-icon">💪</div>
                    <h3>Member Portal</h3>
                    <p>Access your dashboard and track progress</p>
                    <div class="card-arrow">→</div>
                </div>
                
                <div class="portal-card visitor-card" onclick="window.location.href='visitor.html'">
                    <div class="card-icon">🏃‍♂️</div>
                    <h3>Visitor Portal</h3>
                    <p>Explore our gym and membership plans</p>
                    <div class="card-arrow">→</div>
                </div>
            </div>
            
            <div class="hero-footer">
                <p>Welcome to the future of gym management</p>
            </div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
